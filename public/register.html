<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
      content="Read blogs about web development, AI, programming, and technology.">
  <link rel="icon" href="/un-logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://kit.fontawesome.com/1b8a3d6871.js" crossorigin="anonymous"></script>
  <title>Register - BlogSphere</title>
</head>
<body>
  <header>
    <section class="top-heading" style="justify-content:left;">
    <img width="16" src="/un-logo.jpg" alt="website logo">
    <a class="link" href="/">BlogSphere</a>
    </section>
  </header>

  <main class="main-content">
    <section class="hero-section">
      <h1>Create an Account</h1>
      <p>Join our community to write and share your blogs.</p>
    </section>
    <section>
      <form action="/signup" method="POST">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a password">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm your password">
        </div>

        <div>
          <button class="btn" type="submit">Register</button>
        </div>
      </form>

      <p>Already have an account? <a class="anchor link" href="/login.html">Log In</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 BlogSphere. All rights reserved.</p>
  </footer>
</body>
</html>
