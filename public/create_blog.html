<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/un-logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <title>Create blog</title>
</head>
<body>
   <header class="top-bar">
    <div class="top-heading">
      <img class="logo" width="16" src="/un-logo.jpg" alt="logo">
      <span class="site-name">BlogSphere</span>
    </div>

    <nav class="nav-bar">
      <ul class="vertical list">
        <li><a class="nav-link" href="/">Home</a></li>
        <li><a class="nav-link" href="/blogs.html">Blogs</a></li>
        <li><a class="nav-link" href="/add_blog.html">Create Blog</a></li>
      </ul>
      <ul class="auth-btns vertical list">
            <li><a class="blue-btn " href="/login.html">Login</a></li>
            <li><a class="blue-btn " href="/register.html">Register</a></li>
        </ul>

    </nav>
  </header>
  
  <main class="form-main">
    <h2 class="form-heading">Create Blog</h2>
    <form action="/add_blog" method="POST" enctype="multipart/form-data">
      <section class="form-group">
        <label>Blog Title</label>
        <input name="title" type="text" required placeholder="Enter blog title">
      </section>
      <section class="form-group">
        <label>Summary</label>
        <input name="summary" type="text" required placeholder="Write a short summary">
      </section>
      <section class="form-group">
        <label>Blog Content</label>
        <textarea name="content" required rows="12" cols="30" placeholder="Enter your blog.."></textarea>
      </section>
      <section class="form-group">
        <label>Categories</label>
        <select name="categories" required multiple>
          <option value="Web Development">Web Development</option>
          <option value="AI">Ai </option>
          <option value="Full Stack">Full Stack</option>
        </select>
      </section>
      <section class="form-group">
        <label>Featured Image (Max size -5MB)</label>
        <input name="featured-file" type="file" accept="image/*" required>
      </section>
      <button type="submit" class="btn">Add Blog</button>
    </form>
  </main>
  <footer>
    <div>
      <img width="16" class="logo" src="/un-logo-black.jpg" alt="logo">
      <span class="site-name">BlogSphere</span>
    </div>
    <div class="footer-links">
      <ul class="list">

        <li><a class="link" href="/">Home</a></li>
        <li><a class="link" href="#">Blog</a></li>
        <li><a class="link" href="#">About</a></li>
        <li><a class="link" href="#">ContactUs</a></li>
      </ul>
    </div>
    <hr>
    <div class="footer-end-meta">
      <p class="copyrights">&copy;Copyright 2026 BlogSphere. All Rights Reserved.</p>

      <ul class="media-links list">

        <li><a class="social-links" href="#" aria-label="Facebook">
          <i class="fa-brands fa-facebook" style="color: rgb(224, 228, 233);"></i>
        </a></li>
        <li><a class="social-links" href="#" aria-label="Twitter">
          <i class="fa-brands fa-x-twitter" style="color: rgb(224, 228, 233);"></i>
        </a></li>
        <li><a class="social-links" href="#" aria-label="Instagram">
          <i class="fa-brands fa-instagram" style="color: rgb(224, 228, 233);"></i>
        </a></li>
        <li><a class="social-links" href="#" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin" style="color: rgb(224, 228, 233);"></i>
        </a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
